<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国界时间机器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{
  --ink:#0b1320; --ocean:#0f1d2e; --ocean2:#132741; --land:#2a2f33; --grat:rgba(214,190,140,.07);
  --paper:#e9dcc0; --paper-dim:#b8a888; --gold:#d9a441; --gold-soft:rgba(217,164,65,.18);
  --panel:rgba(12,19,31,.86); --line:rgba(233,220,192,.14);
  --serif:"Noto Serif SC","Songti SC",serif; --num:"Cormorant Garamond","Noto Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--serif);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
svg#map{width:100%;height:100%;display:block;cursor:grab;
  background:radial-gradient(ellipse at 50% 40%, #16263a 0%, #0b1320 70%)}
svg#map:active{cursor:grabbing}
.sphere{fill:var(--ocean)}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:none}
.pol{stroke:rgba(10,15,24,.75);stroke-width:.5;vector-effect:non-scaling-stroke;transition:opacity .25s,fill-opacity .25s;cursor:pointer}
.pol:hover{fill-opacity:1;stroke:var(--paper);stroke-width:1.2}
.dim .pol{opacity:.22}
.dim .pol.on{opacity:1;stroke:var(--gold);stroke-width:1.8}
.outline{fill:none;stroke:rgba(233,220,192,.25);stroke-width:1;vector-effect:non-scaling-stroke}

/* header */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 22px;pointer-events:none;z-index:5}
#brand{pointer-events:auto}
#brand h1{font-weight:900;font-size:22px;letter-spacing:.12em}
#brand p{font-size:12px;color:var(--paper-dim);letter-spacing:.08em;margin-top:4px}
#tools{display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);backdrop-filter:blur(8px)}
.seg button{background:none;border:0;color:var(--paper-dim);font:inherit;font-size:12px;padding:7px 13px;cursor:pointer;letter-spacing:.05em}
.seg button.on{background:var(--gold-soft);color:var(--gold)}
#searchWrap{position:relative}
#search{width:210px;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--paper);font:inherit;font-size:13px;padding:7px 14px 7px 32px;outline:none;backdrop-filter:blur(8px)}
#search:focus{border-color:var(--gold)}
#searchWrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
#results{position:absolute;top:calc(100% + 6px);right:0;width:280px;max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);display:none}
#results div{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#results div span{color:var(--paper-dim);font-family:var(--num);font-size:13px;white-space:nowrap}
#results div:hover,#results div.act{background:var(--gold-soft);color:var(--gold)}

/* year badge */
#era{position:absolute;left:22px;bottom:18px;pointer-events:none;z-index:4;max-width:min(520px,60vw)}
#yearBig{font-family:var(--num);font-weight:700;font-size:64px;line-height:1;color:var(--paper);text-shadow:0 2px 30px rgba(0,0,0,.6)}
#yearBig small{font-family:var(--serif);font-size:20px;font-weight:600;margin-right:8px;color:var(--gold);vertical-align:12px}
body.en #caption{font-family:var(--num);font-size:17px;line-height:1.5}
body.en #brand h1{font-family:var(--num);font-size:26px;letter-spacing:.04em}
#caption{margin-top:10px;font-size:15px;line-height:1.7;color:var(--paper);text-shadow:0 1px 12px rgba(0,0,0,.8)}
#count{margin-top:6px;font-size:12px;color:var(--paper-dim);letter-spacing:.06em}

/* tooltip */
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;opacity:0;transition:opacity .12s;z-index:6;max-width:260px;backdrop-filter:blur(8px)}
#tip b{display:block;font-weight:600}
#tip i{font-style:normal;font-size:11.5px;color:var(--paper-dim)}

/* info panel */
#info{position:absolute;right:22px;top:76px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;backdrop-filter:blur(10px);z-index:5;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#info.open{transform:none}
#info .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--paper-dim);font-size:20px;cursor:pointer}
#info .sw{width:34px;height:6px;border-radius:3px;margin-bottom:10px}
#info h2{font-size:19px;font-weight:600;line-height:1.35;padding-right:20px}
#info .orig{font-size:12.5px;color:var(--paper-dim);margin-top:2px;font-family:var(--num);font-size:14px}
#info .meta{font-size:12.5px;color:var(--paper-dim);margin-top:8px;line-height:1.8}
#info .meta b{color:var(--paper);font-weight:400}
#info h3{font-size:12px;font-weight:400;color:var(--paper-dim);letter-spacing:.1em;margin:14px 0 8px}
#chips{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow:auto}
#chips button{font-family:var(--num);font-size:13px;font-weight:600;background:rgba(233,220,192,.06);border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:2px 7px;cursor:pointer}
#chips button.cur{background:var(--gold);color:#1a1205;border-color:var(--gold)}
#chips button:hover{border-color:var(--gold)}
#info a{display:inline-block;margin-top:14px;font-size:12.5px;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(217,164,65,.4)}

/* timeline */
#timeline{position:relative;flex:none;padding:14px 22px 18px;background:linear-gradient(to top,#070c15,rgba(7,12,21,.92));border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;z-index:5}
.btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(233,220,192,.04);color:var(--paper);display:grid;place-items:center;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
#play{width:46px;height:46px;background:var(--gold);color:#1a1205;border-color:var(--gold)}
#play:hover{color:#1a1205;filter:brightness(1.1)}
#track{position:relative;flex:1;height:52px;cursor:pointer;touch-action:none}
#rail{position:absolute;left:0;right:0;top:18px;height:2px;background:var(--line)}
#fill{position:absolute;left:0;top:18px;height:2px;background:var(--gold)}
.tick{position:absolute;top:13px;width:1px;height:12px;background:rgba(233,220,192,.28);transform:translateX(-.5px)}
.tick.passed{background:rgba(217,164,65,.6)}
.tl{position:absolute;top:30px;transform:translateX(-50%);font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--paper-dim);white-space:nowrap;pointer-events:none}
#knob{position:absolute;top:19px;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(217,164,65,.2),0 0 18px rgba(217,164,65,.6);transform:translate(-50%,-50%);transition:left .35s cubic-bezier(.2,.8,.2,1)}
#hoverYear{position:absolute;top:-14px;transform:translateX(-50%);font-family:var(--num);font-size:13px;font-weight:700;background:var(--paper);color:var(--ink);padding:1px 7px;border-radius:4px;opacity:0;pointer-events:none;white-space:nowrap}
#credit{position:absolute;right:22px;bottom:12px;font-size:10.5px;color:rgba(233,220,192,.4);z-index:4;text-align:right;line-height:1.5}
#credit a{color:inherit}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--paper-dim);letter-spacing:.2em;z-index:10;background:var(--ink);transition:opacity .6s}

@media (max-width:760px){
  #top{flex-direction:column;padding:12px 14px}
  #brand h1{font-size:18px}
  #search{width:100%}
  #searchWrap{width:100%}
  #tools{width:100%;justify-content:flex-start}
  #yearBig{font-size:42px}
  #caption{font-size:13px}
  #era{left:14px;bottom:10px;max-width:calc(100vw - 28px)}
  #info{left:10px;right:10px;width:auto;top:auto;bottom:10px;transform:translateY(130%)}
  #credit{display:none}
  #timeline{padding:10px 12px 14px;gap:8px}
  .btn.step{display:none}
  .tl:not(.major){display:none}
}
</style>
</head>

 "1500":"大航海时代开启，印加和阿兹特克帝国正处于巅峰。",
 "1530":"西班牙已经征服阿兹特克，即将征服印加。奥斯曼正值苏莱曼大帝时代。",
 "1600":"明朝晚期，莫卧儿帝国强盛，日本江户幕府即将建立。",
 "1650":"清军入关不久。三十年战争结束，威斯特伐利亚体系确立。",
 "1700":"清朝康熙年间，欧洲各国的殖民扩张正在加速。",
 "1715":"西班牙王位继承战争结束，路易十四去世。",
 "1783":"美国独立获得承认，中国处于乾隆晚期。",
 "1800":"拿破仑时代开始，英国东印度公司已控制印度大片土地。",
 "1815":"维也纳会议召开，拿破仑战败。拉丁美洲独立战争正在进行。",
 "1878":"柏林会议重划巴尔干，列强瓜分非洲前夜。",
 "1880":"晚清。殖民列强在非洲加速圈地。",
 "1900":"非洲几乎被瓜分完毕，八国联军侵华。",
 "1914":"一战爆发前夕，欧洲殖民帝国处于顶峰。切换到「按宗主国」着色更直观。",
 "1920":"一战结束，奥匈、奥斯曼、俄罗斯帝国解体，一批新国家诞生。",
 "1930":"两次世界大战之间，大萧条席卷全球。",
 "1938":"二战前夕，德国吞并奥地利，日本全面侵华。",
 "1945":"二战结束，联合国成立。",
 "1960":"「非洲独立年」，这一年有 17 个非洲国家独立。",
 "1994":"冷战结束，苏联和南斯拉夫解体后的新格局。",
 "2000":"千禧年的世界。",
 "2010":"当代世界格局。"
};
const LABEL_YEARS = new Set([-123000,-3000,-1000,-1,500,1000,1279,1500,1700,1914,2010]);
const MAJOR_YEARS = new Set([-3000,-1,1000,1500,1914,2010]);

const PALETTE = ["#c9604b","#d9a441","#7f9f5a","#4f8a8b","#8a6fae","#c47a9c","#b98a4f","#5e7fb8","#a3b56b","#d17f4a","#6aa58f","#b5584f","#9b8bd0","#c9a86b","#5a9bb0","#a86d5c","#7aa66b","#d0925f","#8d9fc4","#b37fb0"];

const fmtYear = y => {
  if (lang==="en") return y < 0 ? {pre:"", num:(-y).toLocaleString("en"), post:"BC"} : {pre:"AD", num:String(y), post:""};
  return y < 0
    ? (Math.abs(y) >= 10000 ? {pre:"公元前", num:(Math.abs(y)/10000)+" 万", post:"年"} : {pre:"公元前", num:String(-y), post:"年"})
    : {pre:"公元", num:String(y), post:"年"};
};
const yearText = y => { const f = fmtYear(y); return [f.pre,f.num,f.post].filter(Boolean).join(" "); };
const shortYear = y => lang==="en"
  ? (y < 0 ? (Math.abs(y)>=10000 ? (-y/1000)+"k BC" : (-y)+" BC") : String(y))
  : (y < 0 ? (Math.abs(y)>=10000 ? "前"+(Math.abs(y)/10000)+"万" : "前"+(-y)) : String(y));
const hashOf = y => y < 0 ? "bc"+(-y) : "y"+y;
function colorFor(key){ let h=2166136261; for (let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619);} return PALETTE[(h>>>0)%PALETTE.length]; }

let INDEX, YEARS, cur = 0, playing = false, timer = null;
let projMode = "flat", colorMode = "sub", selected = null;
const cache = new Map();
let land, currentFeatures = [];

const svg = d3.select("#map");
const root = svg.append("g");
const gSphere = root.append("path").attr("class","sphere");
const gGrat = root.append("path").attr("class","grat");
const gLand = root.append("path").attr("class","land");
const gPolHolder = root.append("g");
const gOutline = root.append("path").attr("class","outline");
let gPol = gPolHolder.append("g");
const graticule = d3.geoGraticule10();

let W, H, projection, path;
let zoomT = d3.zoomIdentity, globeScale = 1, globeRot = [-100,-25];

function setupProjection(){
  const r = document.getElementById("stage").getBoundingClientRect();
  W = r.width; H = r.height;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  if (projMode === "flat"){
    projection = d3.geoNaturalEarth1().fitExtent([[20,90],[W-20,H-30]],{type:"Sphere"});
  } else {
    if (projection && projection.clipAngle && projection.clipAngle()) globeRot = projection.rotate();
    projection = d3.geoOrthographic().rotate(globeRot).clipAngle(90)
      .fitExtent([[30,100],[W-30,H-30]],{type:"Sphere"});
    projection.scale(projection.scale()*globeScale);
  }
  path = d3.geoPath(projection);
}

function redraw(){
  gSphere.attr("d", path({type:"Sphere"}));
  gOutline.attr("d", path({type:"Sphere"}));
  gGrat.attr("d", path(graticule));
  if (land) gLand.attr("d", path(land));
  gPol.selectAll("path").attr("d", path);
}

// ---- zoom / drag ----
const zoom = d3.zoom().scaleExtent([1,12]).on("zoom", e => {
  if (projMode !== "flat") return;
  zoomT = e.transform; root.attr("transform", zoomT);
});
let raf = null;
function scheduleRedraw(){ if (!raf) raf = requestAnimationFrame(()=>{raf=null;redraw();}); }
let dragStart = null;
const globeDrag = d3.drag()
  .on("start", e => { dragStart = {x:e.x,y:e.y,r:projection.rotate()}; })
  .on("drag", e => {
    const k = 75 / projection.scale();
    const r = dragStart.r;
    projection.rotate([r[0] + (e.x-dragStart.x)*k*1.6, Math.max(-85,Math.min(85, r[1] - (e.y-dragStart.y)*k*1.6)), r[2]]);
    scheduleRedraw();
  });
function onWheelGlobe(e){
  if (projMode !== "globe") return;
  e.preventDefault();
  globeScale = Math.max(.6, Math.min(6, globeScale * Math.exp(-e.deltaY*0.0015)));
  const base = d3.geoOrthographic().fitExtent([[30,100],[W-30,H-30]],{type:"Sphere"}).scale();
  projection.scale(base*globeScale); scheduleRedraw();
}
svg.node().addEventListener("wheel", onWheelGlobe, {passive:false});

function applyMode(){
  if (projMode === "flat"){
    svg.on(".drag", null);
    svg.call(zoom);
    zoomT = d3.zoomIdentity; svg.call(zoom.transform, zoomT);
  } else {
    svg.on(".zoom", null);
    root.attr("transform", null);
    svg.call(globeDrag);
  }
  setupProjection(); redraw();
}

// ---- data ----
async function loadYear(i){
  const y = YEARS[i];
  if (cache.has(y.file)) return cache.get(y.file);
  const p = fetch("data/"+y.file).then(r=>r.json()).then(t=>{
    const obj = t.objects[Object.keys(t.objects)[0]];
    return topojson.feature(t,obj).features.filter(f=>f.geometry && f.properties && f.properties.NAME);
  });
  cache.set(y.file, p);
  return p;
}

function keyOf(p){ return colorMode === "sub" ? (p.SUBJECTO || p.PARTOF || p.NAME) : p.NAME; }

function renderPolities(features){
  currentFeatures = features;
  const old = gPol;
  gPol = gPolHolder.append("g").style("opacity",0);
  gPol.selectAll("path").data(features).join("path")
    .attr("class","pol")
    .attr("d", path)
    .attr("fill", d => colorFor(keyOf(d.properties)))
    .attr("fill-opacity", .82)
    .classed("on", d => selected && d.properties.NAME === selected)
    .on("mousemove", (e,d)=>showTip(e,d))
    .on("mouseleave", hideTip)
    .on("click", (e,d)=>{ e.stopPropagation(); select(d.properties.NAME, d.properties); });
  gPolHolder.classed("dim", !!selected && features.some(f=>f.properties.NAME===selected));
  gPol.transition().duration(450).style("opacity",1);
  old.transition().duration(450).style("opacity",0).remove();
}

function recolor(){
  gPol.selectAll("path").attr("fill", d => colorFor(keyOf(d.properties)));
}

// ---- year switching ----
let reqId = 0, lastCount = 0;
async function go(i, {fromHash=false}={}){
  i = Math.max(0, Math.min(YEARS.length-1, i));
  cur = i;
  const y = YEARS[i].year;
  const f = fmtYear(y);
  document.getElementById("yearBig").innerHTML = (f.pre?`<small>${f.pre}</small>`:"") + f.num + (f.post?`<small style="margin-left:8px;margin-right:0">${f.post}</small>`:"");
  document.getElementById("caption").textContent = (lang==="en"?CAPTIONS_EN:CAPTIONS)[String(y)] || "";
  updateTrack();
  if (!fromHash){ suppressHash = true; location.hash = hashOf(y); }
  const id = ++reqId;
  const feats = await loadYear(i);
  if (id !== reqId) return;
  renderPolities(feats);
  const n = new Set(feats.map(f=>f.properties.NAME)).size;
  lastCount = n; document.getElementById("count").textContent = T("count")(n);
  if (selected) updateChips();
  // prefetch neighbours
  if (i+1 < YEARS.length) loadYear(i+1);
  if (i-1 >= 0) loadYear(i-1);
}

// ---- timeline ----
const track = document.getElementById("track");
function posOf(i){ return (i/(YEARS.length-1))*100; }
function buildTrack(){
  YEARS.forEach((y,i)=>{
    const t = document.createElement("div"); t.className="tick"; t.style.left = posOf(i)+"%"; track.appendChild(t);
    if (LABEL_YEARS.has(y.year)){
      const l = document.createElement("div"); l.className="tl"+(MAJOR_YEARS.has(y.year)?" major":""); l.style.left=posOf(i)+"%"; if(i===0) l.style.transform="none"; if(i===YEARS.length-1) l.style.transform="translateX(-100%)"; l.dataset.y=y.year; l.textContent=shortYear(y.year); track.appendChild(l);
    }
  });
}
function updateTrack(){
  document.getElementById("knob").style.left = posOf(cur)+"%";
  document.getElementById("fill").style.width = posOf(cur)+"%";
  track.querySelectorAll(".tick").forEach((t,i)=>t.classList.toggle("passed", i<=cur));
}
function idxFromEvent(e){
  const r = track.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width));
  return Math.round(x*(YEARS.length-1));
}
let scrubbing = false;
track.addEventListener("pointerdown", e=>{ scrubbing=true; track.setPointerCapture(e.pointerId); stop(); const i=idxFromEvent(e); if(i!==cur) go(i); });
track.addEventListener("pointermove", e=>{
  const i = idxFromEvent(e); const hy = document.getElementById("hoverYear");
  hy.style.left = posOf(i)+"%"; hy.textContent = shortYear(YEARS[i].year); hy.style.opacity = 1;
  if (scrubbing && i!==cur) go(i);
});
track.addEventListener("pointerup", ()=>scrubbing=false);
track.addEventListener("pointerleave", ()=>{ if(!scrubbing) document.getElementById("hoverYear").style.opacity=0; });

function play(){
  if (cur >= YEARS.length-1) go(0);
  playing = true;
  document.getElementById("playIcon").innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  timer = setInterval(()=>{ if (cur >= YEARS.length-1){ stop(); return; } go(cur+1); }, 1700);
}
function stop(){
  playing = false; clearInterval(timer);
  document.getElementById("playIcon").innerHTML = '<path d="M7 4v16l13-8z"/>';
}
document.getElementById("play").onclick = ()=> playing ? stop() : play();
document.getElementById("prev").onclick = ()=>{ stop(); go(cur-1); };
document.getElementById("next").onclick = ()=>{ stop(); go(cur+1); };
document.addEventListener("keydown", e=>{
  if (e.target.tagName === "INPUT") return;
  if (e.key==="ArrowRight"){ stop(); go(cur+1); }
  else if (e.key==="ArrowLeft"){ stop(); go(cur-1); }
  else if (e.key===" "){ e.preventDefault(); playing?stop():play(); }
  else if (e.key==="Escape"){ deselect(); }
});

// ---- tooltip ----
const tip = document.getElementById("tip");
function showTip(e,d){
  const p = d.properties, r = document.getElementById("stage").getBoundingClientRect();
  const sub = p.SUBJECTO && p.SUBJECTO !== p.NAME ? `<i>${T("tipSub")}: ${nm(p.SUBJECTO)}</i>` : "";
  const orig = lang==="zh" && ZH[p.NAME] ? `<i>${p.NAME}</i>` : "";
  tip.innerHTML = `<b>${nm(p.NAME)}</b>${orig}${sub}`;
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x > W - 260) x -= 280;
  tip.style.left = x+"px"; tip.style.top = y+"px"; tip.style.opacity = 1;
}
function hideTip(){ tip.style.opacity = 0; }

// ---- selection / info ----
const info = document.getElementById("info");
function select(name, props){
  selected = name;
  const p = props || (currentFeatures.find(f=>f.properties.NAME===name)||{}).properties || {NAME:name};
  info.querySelector("h2").textContent = nm(name);
  info.querySelector(".orig").textContent = (lang==="zh" && ZH[name]) ? name : "";
  info.querySelector(".sw").style.background = colorFor(keyOf(p));
  const years = INDEX.names[name] || [];
  let meta = "";
  const sep = lang==="zh" ? "：" : ": ";
  if (p.SUBJECTO && p.SUBJECTO !== name) meta += `${T("subj")}${sep}<b>${nm(p.SUBJECTO)}</b><br>`;
  if (p.BORDERPRECISION) meta += `${T("prec")}${sep}<b>${T("prec"+p.BORDERPRECISION)||p.BORDERPRECISION}</b><br>`;
  if (years.length) meta += `${T("span")}${sep}<b>${yearText(years[0])} – ${yearText(years[years.length-1])}</b>`;
  info.querySelector(".meta").innerHTML = meta;
  info.querySelector("a").href = (lang==="zh" && ZH[name])
    ? "https://zh.wikipedia.org/wiki/Special:Search?search="+encodeURIComponent(ZH[name].replace(/（.*?）/g,""))
    : "https://en.wikipedia.org/wiki/Special:Search?search="+encodeURIComponent(name);
  updateChips();
  info.classList.add("open");
  gPol.selectAll("path").classed("on", d=>d.properties.NAME===name);
  gPolHolder.classed("dim", currentFeatures.some(f=>f.properties.NAME===name));
}
function updateChips(){
  const years = INDEX.names[selected] || [];
  const box = document.getElementById("chips"); box.innerHTML = "";
  years.forEach(y=>{
    const b = document.createElement("button"); b.textContent = shortYear(y);
    if (y === YEARS[cur].year) b.className = "cur";
    b.onclick = ()=>{ stop(); go(YEARS.findIndex(o=>o.year===y)); };
    box.appendChild(b);
  });
  gPolHolder.classed("dim", currentFeatures.some(f=>f.properties.NAME===selected));
}
function deselect(){
  selected = null; info.classList.remove("open");
  gPolHolder.classed("dim", false); gPol.selectAll("path").classed("on", false);
}
info.querySelector(".x").onclick = deselect;
svg.on("click", ()=>{ if (selected) deselect(); });

// ---- search ----
const search = document.getElementById("search"), results = document.getElementById("results");
let hits = [], act = -1;
const esc = q => q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function zrank(n,q){ const z=ZH[n]; if(!z) return 9; if(z===q) return 0; if(z.startsWith(q)) return 1; return z.includes(q)?3:9; }
function rank(n,q){ const l=n.toLowerCase(); if(l===q) return 0; const w=new RegExp("\\b"+esc(q)+"\\b").test(l); if(w&&l.startsWith(q)) return 1; if(w) return 2; if(l.startsWith(q)) return 3; return 4; }
search.addEventListener("input", ()=>{
  const q = search.value.trim().toLowerCase();
  if (q.length < (/[\u4e00-\u9fff]/.test(q)?1:2)){ results.style.display="none"; return; }
  hits = Object.keys(INDEX.names).filter(n=>n.toLowerCase().includes(q) || (ZH[n] && ZH[n].includes(q)))
    .sort((a,b)=> Math.min(rank(a,q),zrank(a,q))-Math.min(rank(b,q),zrank(b,q)) || INDEX.names[b].length-INDEX.names[a].length)
    .slice(0,40);
  act = -1;
  results.innerHTML = hits.length ? hits.map((n,i)=>{
    const ys = INDEX.names[n];
    const label = lang==="zh" && ZH[n] ? `${ZH[n]} <em style="font-style:normal;color:var(--paper-dim);font-size:12px">${n}</em>` : n;
    return `<div data-i="${i}"><span style="color:inherit;font-family:inherit;white-space:normal">${label}</span><span>${shortYear(ys[0])}${ys.length>1?" – "+shortYear(ys[ys.length-1]):""}</span></div>`;
  }).join("") : `<div style="cursor:default;color:var(--paper-dim)">${T("none")}</div>`;
  results.style.display = "block";
});
search.addEventListener("keydown", e=>{
  const items = results.querySelectorAll("div[data-i]");
  if (e.key==="ArrowDown"){ act=Math.min(items.length-1,act+1); }
  else if (e.key==="ArrowUp"){ act=Math.max(0,act-1); }
  else if (e.key==="Enter"){ if (hits.length) pick(hits[Math.max(0,act)]); return; }
  else if (e.key==="Escape"){ results.style.display="none"; return; }
  else return;
  e.preventDefault(); items.forEach((d,i)=>d.classList.toggle("act",i===act));
});
results.addEventListener("click", e=>{ const d=e.target.closest("div[data-i]"); if(d) pick(hits[+d.dataset.i]); });
document.addEventListener("click", e=>{ if(!e.target.closest("#searchWrap")) results.style.display="none"; });
async function pick(name){
  results.style.display="none"; search.value = nm(name); search.blur(); stop();
  const ys = INDEX.names[name]; const cy = YEARS[cur].year;
  const target = ys.includes(cy) ? cy : ys.reduce((a,b)=> Math.abs(b-cy)<Math.abs(a-cy)?b:a);
  selected = name;
  await go(YEARS.findIndex(o=>o.year===target));
  const f = currentFeatures.find(f=>f.properties.NAME===name);
  select(name, f && f.properties);
  if (f) focusFeature(f);
}
function focusFeature(f){
  if (projMode === "globe"){
    const c = d3.geoCentroid(f);
    const r0 = projection.rotate(), r1 = [-c[0], -c[1], 0];
    const it = d3.interpolate(r0, r1);
    d3.transition().duration(900).tween("rot", ()=>t=>{ projection.rotate(it(t)); redraw(); });
  } else {
    const [[x0,y0],[x1,y1]] = path.bounds(f);
    const k = Math.min(5, 0.55/Math.max((x1-x0)/W,(y1-y0)/H));
    const t = d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(1,k)).translate(-(x0+x1)/2,-(y0+y1)/2);
    svg.transition().duration(900).call(zoom.transform, t);
  }
}

// ---- toggles ----
function seg(id, fn){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on",x===b)); fn(b.dataset.v);
  });
}
seg("projSeg", v=>{ projMode=v; globeScale=1; applyMode(); });
seg("colorSeg", v=>{ colorMode=v; recolor(); if(selected) select(selected); });
seg("langSeg", v=>{ lang=v; try{localStorage.setItem("btm-lang",v);}catch(e){} applyLang(); });
function applyLang(){
  document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
  document.title = T("docTitle");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T(el.dataset.t); });
  document.getElementById("search").placeholder = T("search");
  document.getElementById("credit").innerHTML = T("credit");
  const ld = document.getElementById("loading"); if (ld) ld.textContent = T("loading");
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on", b.dataset.v===lang));
  document.body.classList.toggle("en", lang==="en");
  track.querySelectorAll(".tl").forEach(l=>{ l.textContent = shortYear(+l.dataset.y); });
  if (YEARS){
    const y = YEARS[cur].year, f = fmtYear(y);
    document.getElementById("yearBig").innerHTML = (f.pre?`<small>${f.pre}</small>`:"") + f.num + (f.post?`<small style="margin-left:8px;margin-right:0">${f.post}</small>`:"");
    document.getElementById("caption").textContent = (lang==="en"?CAPTIONS_EN:CAPTIONS)[String(y)] || "";
    if (lastCount) document.getElementById("count").textContent = T("count")(lastCount);
  }
  if (selected) select(selected);
  if (search.value && selected) search.value = nm(selected);
}

// ---- hash ----
let suppressHash = false;
function idxFromHash(){
  const h = location.hash.slice(1); let y = null;
  if (/^bc\d+$/.test(h)) y = -parseInt(h.slice(2)); else if (/^y\d+$/.test(h)) y = parseInt(h.slice(1));
  const i = YEARS.findIndex(o=>o.year===y); return i;
}
window.addEventListener("hashchange", ()=>{
  if (suppressHash){ suppressHash=false; return; }
  const i = idxFromHash(); if (i>=0 && i!==cur){ stop(); go(i,{fromHash:true}); }
});

window.addEventListener("resize", ()=>{ setupProjection(); if(projMode==="flat"){ svg.call(zoom.transform, d3.zoomIdentity); } redraw(); });

// ---- boot ----
(async function(){
  applyLang();
  const [idx, landTopo, zh] = await Promise.all([fetch("data/index.json").then(r=>r.json()), fetch("data/land.json").then(r=>r.json()), fetch("data/zh.json").then(r=>r.json())]);
  ZH = zh;
  INDEX = idx; YEARS = idx.years;
  land = topojson.feature(landTopo, landTopo.objects.land);
  buildTrack();
  applyMode();
  let start = idxFromHash();
  if (start < 0) start = YEARS.findIndex(o=>o.year===1279);
  await go(start, {fromHash: idxFromHash()>=0});
  const ld = document.getElementById("loading"); ld.style.opacity=0; setTimeout(()=>ld.remove(),600);
})();
</script>
